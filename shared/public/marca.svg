<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cl-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ece7db"/></linearGradient>
    <linearGradient id="cl-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfc74"/><stop offset="1" stop-color="#b6e53a"/></linearGradient>
  </defs>
  <style>
    .cl-ficha{animation:cl-entra .95s cubic-bezier(.2,1.5,.35,1) .1s both}
    .cl-brillo{animation:cl-brillo 5s ease-in-out 1.2s infinite}
    @keyframes cl-entra{from{transform:translateX(36px);opacity:0}}
    @keyframes cl-brillo{0%,82%,100%{opacity:.5}90%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.cl-ficha,.cl-brillo{animation:none}}
  </style>
  <!-- Dos piezas enfrentadas, con volumen: el espacio entre ellas forma la C de cadalado -->
  <path fill="#b3ad9f" transform="translate(0 5)" d="M14 3H50A10 10 0 0 1 60 13V14H36A15 15 0 0 0 36 44H60V45A10 10 0 0 1 50 55H14A10 10 0 0 1 4 45V13A10 10 0 0 1 14 3Z"/>
  <path fill="url(#cl-b)" d="M14 3H50A10 10 0 0 1 60 13V14H36A15 15 0 0 0 36 44H60V45A10 10 0 0 1 50 55H14A10 10 0 0 1 4 45V13A10 10 0 0 1 14 3Z"/>
  <g class="cl-ficha">
    <path fill="#86ac22" transform="translate(0 3.5)" d="M60 18.5H36A10.5 10.5 0 0 0 36 39.5H60Z"/>
    <path fill="url(#cl-l)" d="M60 18.5H36A10.5 10.5 0 0 0 36 39.5H60Z"/>
    <path class="cl-brillo" fill="#fff" opacity=".5" d="M35.5 22.5H52a2 2 0 0 1 0 4H35.5a2 2 0 0 1 0-4Z"/>
  </g>
</svg>
